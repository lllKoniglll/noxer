services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b-cloud}
      NOXER_DATA_DIR: /data/noxer
      NOXER_WORKSPACE_GROUP_PREFIX: ${NOXER_WORKSPACE_GROUP_PREFIX:-noxer-workspace-}
      NOXER_MAX_FILE_BYTES: ${NOXER_MAX_FILE_BYTES:-26214400}
    volumes:
      - ${NOXER_DATA_PATH:-./data}:/data/noxer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ai-network

  web:
    container_name: noxer-web
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_API_URL: http://backend:8001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ai-network

networks:
  ai-network:
    external: true
    name: ai-network
