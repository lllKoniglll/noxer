[project]
name = "noxer-agent-backend"
version = "0.1.0"
description = "Python backend for Kronangs IF economy agent"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "google-adk>=1.0.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
